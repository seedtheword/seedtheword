name: Admin Editor Tests

# Runs the Node-based test suite on any PR or push that touches the
# admin-editor modules or their tests. Uses only Node's built-in test
# runner (node --test) and built-in assert module — zero external deps.

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/admin-editor*.js'
      - 'assets/js/main.js'
      - 'assets/css/main.css'
      - 'index.html'
      - 'about.html'
      - 'assets/videos/**'
      - 'assets/images/gospel/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/admin-editor-tests.yml'
  pull_request:
    paths:
      - 'assets/js/admin-editor*.js'
      - 'assets/js/main.js'
      - 'assets/css/main.css'
      - 'index.html'
      - 'about.html'
      - 'assets/videos/**'
      - 'assets/images/gospel/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/admin-editor-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Print versions
        run: node --version

      - name: Install devDependencies
        # Both the admin-editor tests and the jesus-storytelling suite
        # discover via `node --test tests/`, so all devDeps (fast-check,
        # parse5, jsdom) must be installed before either test run. We use
        # `npm install` instead of `npm ci` because the repo doesn't
        # commit package-lock.json (the only deps are dev-only test
        # libraries; the deployed site loads zero npm packages).
        run: npm install --no-audit --no-fund

      - name: Syntax-check every admin-editor module
        run: |
          set -e
          for f in assets/js/admin-editor*.js; do
            echo "==> $f"
            node --check "$f"
          done

      - name: Run tests
        id: tests
        run: |
          set -o pipefail
          # Tee test output to a file AND to stdout; the file gets uploaded
          # to the job summary below, which is readable via the public API
          # (no auth needed) even for private-repo observers.
          # `node --test tests/` discovers every *.test.js — both the
          # admin-editor tests and the jesus-storytelling suite — so we
          # only need this single invocation now that devDeps are
          # installed. The separate `npm run test:jesus-storytelling`
          # step below is kept as a safety net for the targeted run.
          node --test tests/ 2>&1 | tee /tmp/test-output.txt

      - name: Run jesus-storytelling property + integration suite (targeted)
        id: jesus_storytelling_tests
        # The full `node --test tests/` step above already runs this
        # suite; this targeted invocation is kept so failures surface
        # in their own log artifact when triaging.
        run: |
          set -o pipefail
          npm run test:jesus-storytelling 2>&1 | tee /tmp/jesus-storytelling-output.txt

      - name: Attach test output to job summary
        if: always()
        run: |
          if [ -f /tmp/test-output.txt ]; then
            echo "## Test output (admin-editor)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 200 /tmp/test-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f /tmp/jesus-storytelling-output.txt ]; then
            echo "## Test output (jesus-storytelling)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 200 /tmp/jesus-storytelling-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            /tmp/test-output.txt
            /tmp/jesus-storytelling-output.txt
          retention-days: 7
