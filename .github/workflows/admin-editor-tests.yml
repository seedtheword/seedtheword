name: Admin Editor Tests

# Runs the Node-based test suite on any PR or push that touches the
# admin-editor modules or their tests. Uses only Node's built-in test
# runner (node --test) and built-in assert module — zero external deps.

on:
  push:
    branches: [main]
    paths:
      - 'assets/js/admin-editor*.js'
      - 'assets/js/main.js'
      - 'assets/css/main.css'
      - 'index.html'
      - 'about.html'
      - 'assets/videos/**'
      - 'assets/images/gospel/**'
      - 'assets/data/telegram-bot.json'
      - 'tests/**'
      - 'package.json'
      - '.github/scripts/bible_books.py'
      - '.github/scripts/clean_bible_audio.py'
      - 'docs/apps-script/bible-audio.gs'
      - '.github/workflows/admin-editor-tests.yml'
      - '.github/workflows/bible-audio-cleanup.yml'
  pull_request:
    paths:
      - 'assets/js/admin-editor*.js'
      - 'assets/js/main.js'
      - 'assets/css/main.css'
      - 'index.html'
      - 'about.html'
      - 'assets/videos/**'
      - 'assets/images/gospel/**'
      - 'assets/data/telegram-bot.json'
      - 'tests/**'
      - 'package.json'
      - '.github/scripts/bible_books.py'
      - '.github/scripts/clean_bible_audio.py'
      - 'docs/apps-script/bible-audio.gs'
      - '.github/workflows/admin-editor-tests.yml'
      - '.github/workflows/bible-audio-cleanup.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        # Stage 2 cleanup script and the bible-audio property/unit
        # tests both run on Python 3.11. Hypothesis + pytest are
        # installed in a separate step below.
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Print versions
        run: |
          node --version
          python --version

      - name: Install Python deps
        run: pip install pytest hypothesis

      - name: Install devDependencies
        # Both the admin-editor tests and the jesus-storytelling suite
        # need devDeps installed (jesus-storytelling imports fast-check,
        # parse5, jsdom). We use `npm install` instead of `npm ci`
        # because the repo doesn't commit package-lock.json (the only
        # deps are dev-only test libraries; the deployed site loads
        # zero npm packages).
        run: npm install --no-audit --no-fund

      - name: Syntax-check every admin-editor module
        run: |
          set -e
          for f in assets/js/admin-editor*.js; do
            echo "==> $f"
            node --check "$f"
          done

      - name: Syntax-check the Bible Audio Apps Script source
        # Apps Script V8 is syntactically a JS subset; node --check
        # catches typos here without booting Apps Script. Node 20
        # refuses to parse a file unless its extension is one it
        # recognizes, so we copy the .gs to a .js tmp first.
        run: |
          cp docs/apps-script/bible-audio.gs /tmp/bible-audio.js
          node --check /tmp/bible-audio.js

      - name: Run admin-editor tests
        id: tests
        run: |
          set -o pipefail
          # Run ONLY the admin-editor tests here, not the jesus-
          # storytelling suite — they live in the same tests/ folder
          # but have different shapes (admin-editor uses Node built-ins
          # only; jesus-storytelling uses fast-check / parse5 / jsdom).
          # Listing files explicitly avoids the discovery surprise of
          # `node --test tests/` picking up everything.
          node --test \
            tests/commit-message.test.js \
            tests/diff.test.js \
            tests/draft-store.test.js \
            tests/github-client.test.js \
            tests/js-literal.test.js \
            tests/smoke.test.js \
            tests/validate.test.js \
            2>&1 | tee /tmp/test-output.txt

      - name: Run jesus-storytelling property + integration suite
        id: jesus_storytelling_tests
        # All 15 tests in this suite (10 fast-check properties at
        # 100-200 runs each plus 5 integration examples) must pass.
        # Failures here will fail the workflow.
        run: |
          set -o pipefail
          npm run test:jesus-storytelling 2>&1 | tee /tmp/jesus-storytelling-output.txt

      - name: Run schema-testimonies property + example + integration suite
        id: schema_testimonies_tests
        # Property tests P1–P6 (round-trip identity, validator
        # monotonicity, renderer compatibility via jsdom, id uniqueness,
        # body paragraph preservation, consent enum closure) plus
        # per-field and schema-level example tests plus a live-fixture
        # integration test against assets/data/testimonies.json.
        # Spec: .kiro/specs/admin-editor-testimonies-schema/
        run: |
          set -o pipefail
          npm run test:schema-testimonies 2>&1 | tee /tmp/schema-testimonies-output.txt

      - name: Run bible-audio property + unit tests
        id: bible_audio_tests
        # Python-side property tests P1, P3, P4, P5, P6, P7 plus
        # branch/example tests for clean_bible_audio.py and the
        # Stage-1 logic mirror. The optional 5.x and 9.x tasks
        # write into tests/property/ and tests/unit/ respectively;
        # we invoke pytest against both directories so the suite
        # is no-op (exit 0, "no tests ran") until those files
        # land, and turns into a real check the moment they do.
        # Spec: .kiro/specs/bible-audio-pipeline/
        run: |
          set -o pipefail
          mkdir -p tests/property tests/unit
          pytest tests/property tests/unit -v 2>&1 | tee /tmp/bible-audio-output.txt || EC=$?
          # pytest exit 5 == "no tests collected" — that's an
          # acceptable state while the optional test files are
          # still being authored. Any other non-zero exit fails.
          if [ -n "${EC:-}" ] && [ "${EC}" -ne 5 ]; then
            exit "${EC}"
          fi

      - name: Attach test output to job summary
        if: always()
        run: |
          if [ -f /tmp/test-output.txt ]; then
            echo "## Test output (admin-editor)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 200 /tmp/test-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f /tmp/jesus-storytelling-output.txt ]; then
            echo "## Test output (jesus-storytelling)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 200 /tmp/jesus-storytelling-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f /tmp/schema-testimonies-output.txt ]; then
            echo "## Test output (schema-testimonies)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 200 /tmp/schema-testimonies-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f /tmp/bible-audio-output.txt ]; then
            echo "## Test output (bible-audio)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 200 /tmp/bible-audio-output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload test output as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: |
            /tmp/test-output.txt
            /tmp/jesus-storytelling-output.txt
            /tmp/schema-testimonies-output.txt
            /tmp/bible-audio-output.txt
          retention-days: 7
