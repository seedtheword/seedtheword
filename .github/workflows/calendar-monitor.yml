name: Calendar Thin Monitor

# Scheduled cron disabled May 2026 — migrated to Apps Script time
# trigger (dailyCalendarMonitor function in order-handler.gs).
# Kept as workflow_dispatch for manual ad-hoc checks.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If 'true', log the alert body without emailing"
        required: false
        default: 'false'
      threshold:
        description: "Override CAL_MONITOR_MIN (default 2). Useful for testing."
        required: false
        default: ''
      days:
        description: "Override CAL_MONITOR_DAYS (default 7)."
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: calendar-monitor
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run calendar-thin monitor
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          CAL_MONITOR_DAYS: ${{ github.event.inputs.days || '' }}
          CAL_MONITOR_MIN: ${{ github.event.inputs.threshold || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python .github/scripts/check_calendar_thin.py
