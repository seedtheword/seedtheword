name: Daily Bible Reading

on:
  # Scheduled cron disabled — GitHub free-tier was silently dropping
  # the schedule, so the Bible bot is now run as a step inside the
  # hourly heartbeat workflow (.github/workflows/heartbeat.yml). The
  # bot's once-per-day dedup log makes that safe. workflow_dispatch
  # is kept for manual catch-up runs.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If 'true', build the post without sending it"
        required: false
        default: 'false'
      force:
        description: "If 'true', bypass the once-per-day dedup guard"
        required: false
        default: 'false'

permissions:
  contents: write   # bot commits the dedup log on every successful post

concurrency:
  group: telegram-bible
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Bible bot
        env:
          TELEGRAM_BIBLE_BOT_TOKEN: ${{ secrets.TELEGRAM_BIBLE_BOT_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          FORCE_POST: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python .github/scripts/post_daily_bible_to_telegram.py

      - name: Commit dedup log if it changed
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -z "$(git status --porcelain assets/data/telegram-bible-log.json)" ]; then
            echo "No dedup-log change to commit."
            exit 0
          fi
          git config user.name  "stw-bible-bot"
          git config user.email "stw-bible-bot@users.noreply.github.com"
          # Stash the unstaged change so the rebase can run cleanly,
          # pull anything that landed on main while the bot was working,
          # then re-apply the stash on top.
          git stash push -m "bible-bot-dedup" -- assets/data/telegram-bible-log.json
          git pull --rebase origin main
          git stash pop || true
          # If the file is still dirty after the pop, commit it.
          if [ -n "$(git status --porcelain assets/data/telegram-bible-log.json)" ]; then
            git add assets/data/telegram-bible-log.json
            git commit -m "chore(bible-bot): dedup log update"
            git push origin main
          else
            echo "Dedup log already current after rebase; nothing to push."
          fi
