name: Keep-alive heartbeat

# Purpose: GitHub Actions free tier deprioritizes scheduled workflows
# on repos that look "quiet" and eventually stops firing them at all
# after ~60 days of inactivity. Background bots (Telegram announcements,
# Bible bot, playlist digest) depend on scheduled triggers firing
# reliably, so this workflow commits a one-line timestamp every hour
# to tell GitHub the repo is active.
#
# What it does NOT do:
#   * any content work — bots stay in their own workflows
#   * change anything user-visible — the heartbeat file lives outside
#     assets/ and is not referenced by the site
#
# Cost: ~15 seconds of compute per run, well inside free tier.

on:
  schedule:
    # Every hour at :07 so the heartbeat doesn't collide with the
    # every-15-min announcement runs (which fire at :00, :15, :30, :45).
    - cron: '7 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: heartbeat
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Write heartbeat timestamp
        run: |
          mkdir -p .github/heartbeat
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat/last-tick.txt

      # Bible bot piggyback DISABLED May 2026 — moved to Apps Script
      # time trigger (dailyBibleBot in order-handler.gs) which fires
      # reliably. The heartbeat now only writes the timestamp; it no
      # longer runs the Bible script. Kept here as a comment block so
      # the historical context is visible.
      #
      # Old behavior: this step ran post_daily_bible_to_telegram.py
      # if the current PT hour was 8-11 Mon-Sat, relying on the
      # script's once-per-day dedup log.

      - name: Commit the tick + dedup log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat/last-tick.txt 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No timestamp/log change this tick."
            exit 0
          fi
          git commit -m "chore: heartbeat tick [skip ci]"
          # Best-effort push with rebase to handle races with other workflows.
          git pull --rebase origin main || true
          git push || {
            echo "Push failed (probably a race with another workflow). Next tick will retry."
            exit 0
          }
