name: Scrape Instagram Feed

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch:          # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch feed, download images, update JSON
        run: python .github/scripts/scrape_instagram.py
        env:
          FEED_URL: https://rss.app/feeds/v1.1/PfYYrhORCtf8iLjw.json
          OUT_PATH: assets/data/instagram.json
          IMG_DIR: assets/images/instagram

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/instagram.json assets/images/instagram
          if git diff --cached --quiet; then
            echo "No changes to Instagram data."
          else
            git commit -m "chore(instagram): refresh feed [skip ci]"
            git push
          fi
