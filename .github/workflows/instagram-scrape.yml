name: Scrape Instagram Feed

on:
  schedule:
    - cron: '0 9 * * *'   # 09:00 UTC daily (~02:00 PDT)
  workflow_dispatch:       # allow manual runs from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch feed and update JSON
        run: python .github/scripts/scrape_instagram.py
        env:
          FEED_URL: https://rss.app/feeds/v1.1/PfYYrhORCtf8iLjw.json
          OUT_PATH: assets/data/instagram.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet assets/data/instagram.json; then
            echo "No changes to Instagram data."
          else
            git add assets/data/instagram.json
            git commit -m "chore(instagram): refresh feed [skip ci]"
            git push
          fi
