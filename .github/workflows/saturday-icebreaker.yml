name: Saturday Icebreaker

# Posts a weekly icebreaker into the @seedtheword Telegram supergroup's
# "Discuss Scripture" topic (thread 434) every Saturday morning. The
# question is generated by Gemini from this week's NT, OT history, and
# Poetry & Prophecy walks; falls back deterministically to a small
# evergreen rotation if Gemini is missing or unreachable.
#
# Cron is intentionally absent — the workflow is fired by an Apps
# Script kicker (`kickSaturdayIcebreaker` in order-handler.gs) that
# runs daily at 09:00 PT and bails on non-Saturday weekdays. Same
# pattern as the other Apps-Script-driven Telegram bots.
#
# Two manual-dispatch inputs:
#   * dry_run   — render the message without posting
#   * test_run  — post a clearly-labeled '(test)' preview so admins
#                 can verify the look on a non-Saturday before the
#                 real run lands. Also bypasses the once-per-day
#                 dedup so a test can be repeated.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If 'true', build the post without sending it"
        required: false
        default: 'false'
      test_run:
        description: "If 'true', post a labeled '(test)' preview (bypasses dedup)"
        required: false
        default: 'false'
      force:
        description: "If 'true', bypass the once-per-day dedup guard"
        required: false
        default: 'false'

permissions:
  contents: write   # to commit the dedup log on a successful post

concurrency:
  group: telegram-icebreaker
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Saturday Icebreaker
        env:
          TELEGRAM_BIBLE_BOT_TOKEN: ${{ secrets.TELEGRAM_BIBLE_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          TEST_RUN: ${{ github.event.inputs.test_run == 'true' && '1' || '' }}
          FORCE_POST: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python .github/scripts/post_saturday_icebreaker_to_telegram.py

      - name: Commit dedup log if it changed
        if: ${{ github.event.inputs.dry_run != 'true' && github.event.inputs.test_run != 'true' }}
        run: |
          if [ -z "$(git status --porcelain assets/data/telegram-bible-log.json)" ]; then
            echo "No dedup-log change to commit."
            exit 0
          fi
          git config user.name  "stw-bible-bot"
          git config user.email "stw-bible-bot@users.noreply.github.com"
          git stash push -m "icebreaker-dedup" -- assets/data/telegram-bible-log.json
          git pull --rebase origin main
          git stash pop || true
          if [ -n "$(git status --porcelain assets/data/telegram-bible-log.json)" ]; then
            git add assets/data/telegram-bible-log.json
            git commit -m "chore(icebreaker): dedup log update"
            git push origin main
          fi
