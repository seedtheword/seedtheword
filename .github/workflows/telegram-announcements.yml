name: Telegram Announcements

on:
  schedule:
    # Cron is UTC. Runs every 15 minutes, every day. Each run is
    # idempotent — the dedup log at assets/data/telegram-announcement-log.json
    # prevents re-posting anything that has already been announced
    # under the same trigger kind (upcoming / reminder / live).
    #
    # Why every 15 minutes instead of 3 fixed daily slots:
    #   * GitHub free-tier scheduled actions can be delayed 5-30 minutes
    #     or silently skipped when Actions is under load. Running every
    #     15 minutes means any single delayed/skipped run is caught by
    #     the next tick. A post that missed its 5 PM slot used to wait
    #     until 7 AM the next morning; now it lands within 15 minutes.
    #   * Events added to the calendar mid-day are picked up the next
    #     tick (≤15 minutes), not the next fixed slot.
    #   * The script's quiet-hours guard prevents 3 AM posts; live
    #     events can still fire inside normal ministry event windows.
    #
    # Cost: ~2880 runs/month × ~15s each ≈ 12 minutes of runner time per
    # month. Well within the 2000-minute free tier.
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Allow ad-hoc runs (including dry-runs) from the Actions tab.
    inputs:
      dry_run:
        description: "If 'true', build and log the message without posting to Telegram"
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  # Cancel nothing in-flight, but prevent two runs from colliding on
  # the dedup log.
  group: telegram-announcements
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run announcement script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
        run: python .github/scripts/post_calendar_to_telegram.py

      - name: Commit dedup log if changed
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/telegram-announcement-log.json
          if git diff --cached --quiet; then
            echo "No dedup log changes — nothing posted this run."
            exit 0
          fi
          git commit -m "chore(telegram): update announcement log [skip ci]"
          # Retry a few times in case local pushes raced with us
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          # Non-fatal: the next run will rebuild the diff.
          echo "Push retries exhausted; next scheduled run will retry."
          exit 0
