name: Weekly Digest

on:
  # Scheduled cron disabled May 2026 — migrated to Apps Script time
  # trigger (weeklyMemberDigest function in order-handler.gs) for
  # reliable firing. Kept as workflow_dispatch for manual catch-up.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If 'true', preview the digest without sending"
        required: false
        default: 'false'
      force:
        description: "If 'true', re-send even when today's digest already fired"
        required: false
        default: 'false'

permissions:
  contents: write   # to commit digest-log.json

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Send Weekly Digest
        env:
          APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run == 'true' && '1' || '' }}
          FORCE: ${{ github.event.inputs.force == 'true' && '1' || '' }}
        run: python .github/scripts/send_weekly_digest.py

      - name: Commit digest log if changed
        if: ${{ !cancelled() && github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/digest-log.json || true
          if git diff --cached --quiet; then
            echo "No log changes to commit."
            exit 0
          fi
          git commit -m "chore(digest): update weekly-digest log [skip ci]"
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          echo "Push retries exhausted; next scheduled run will retry."
          exit 0
