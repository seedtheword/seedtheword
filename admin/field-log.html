<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Field Log — Seed the Word Admin</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Source Sans 3', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
      --bg: #FAFAF8;
      --card: #FFFFFF;
      --ink: #1A1A1A;
      --ink2: #2C2C2C;
      --muted: #6B6B6B;
      --gold: #B8860B;
      --gold-light: #D4A84B;
      --gold-soft: #FFF8E8;
      --border: #E8E4DF;
      --green: #1a5c1d;
      --green-soft: #dfecdf;
      --red: #a6251f;
      --radius: 10px;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      font-size: 16px;
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    /* Gate */
    .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    .gate__card {
      background: var(--card); border: 1px solid var(--border); border-top: 3px solid var(--gold);
      border-radius: var(--radius); padding: 2.5rem 2rem; max-width: 380px; width: 100%;
      text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.06);
    }
    .gate__icon { font-size: 2.2rem; margin-bottom: 0.6rem; }
    .gate__title { font-family: var(--serif); font-size: 1.5rem; font-weight: 400; margin: 0 0 0.35rem; }
    .gate__hint { font-size: 0.9rem; color: var(--muted); margin: 0 0 1.25rem; line-height: 1.6; }
    .gate__input {
      width: 100%; padding: 0.85rem 1rem; border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 1rem; font-family: inherit; margin-bottom: 0.65rem; background: #fff;
    }
    .gate__input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,134,11,0.15); }
    .gate__error { color: var(--red); font-size: 0.85rem; font-weight: 600; min-height: 1.2rem; margin-bottom: 0.4rem; }
    .gate__btn {
      width: 100%; padding: 0.9rem; background: var(--gold); color: #fff; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .gate__btn:hover { background: #9a7209; }
    /* Shell */
    .shell { display: none; }
    .shell.visible { display: block; }
    .header {
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 50;
    }
    .header__title { font-family: var(--serif); font-size: 1.15rem; font-weight: 400; margin: 0; color: var(--ink); }
    .header__sub { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); margin: 0.15rem 0 0; letter-spacing: 0.04em; }
    .logout-btn {
      background: var(--bg); border: 1px solid var(--border); color: var(--muted);
      border-radius: 6px; padding: 0.4rem 0.75rem; font-size: 0.78rem; font-weight: 600;
      cursor: pointer; font-family: inherit;
    }
    .logout-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* Form */
    .form-wrap { max-width: 520px; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
    .section-label {
      font-family: var(--mono); font-size: 0.62rem; font-weight: 500; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--muted); margin: 1.75rem 0 0.6rem; padding-top: 0.75rem;
      border-top: 1px solid var(--border);
    }
    .section-label:first-child { border-top: none; padding-top: 0; margin-top: 0; }
    label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 0.25rem; color: var(--ink); }
    input, select, textarea {
      width: 100%; padding: 0.75rem 0.85rem; border: 1.5px solid var(--border); border-radius: 8px;
      font-size: 0.95rem; font-family: inherit; background: var(--card); margin-bottom: 0.85rem;
      color: var(--ink); -webkit-appearance: none;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,134,11,0.12); }
    textarea { min-height: 70px; resize: vertical; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 400px) { .row2 { grid-template-columns: 1fr; } }
    /* QR Scanner */
    .qr-section { margin-bottom: 1.25rem; }
    .qr-toggle {
      width: 100%; padding: 0.85rem 1rem; background: var(--gold); color: #fff; border: none;
      border-radius: 8px; font-size: 0.92rem; font-weight: 600; cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
    }
    .qr-toggle:hover { background: #9a7209; }
    #qr-reader { width: 100%; min-height: 220px; display: none; border-radius: 8px; overflow: hidden; margin-top: 0.75rem; }
    #qr-reader.active { display: block; }
    .qr-status {
      padding: 0.5rem 0; font-size: 0.82rem; color: var(--muted); text-align: center; min-height: 1.5rem;
    }
    .qr-status.success { color: var(--green); font-weight: 600; }
    .qr-status.error { color: var(--red); }

    /* Placement items */
    .pl-item {
      display: grid; grid-template-columns: 1fr 56px 32px; gap: 0.5rem; align-items: center;
      padding: 0.7rem 0.85rem; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 0.5rem;
    }
    .pl-item__name { font-weight: 600; font-size: 0.88rem; color: var(--ink); line-height: 1.25; }
    .pl-item__id { font-family: var(--mono); font-size: 0.68rem; color: var(--gold); font-weight: 500; }
    .pl-item__cost { font-size: 0.68rem; color: var(--muted); }
    .pl-item__qty {
      width: 100%; padding: 0.45rem; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.9rem; text-align: center; font-family: inherit; background: var(--card); margin: 0;
    }
    .pl-item__rm {
      width: 32px; height: 32px; background: #fff0ef; border: 1px solid #fcc; border-radius: 6px;
      color: var(--red); font-size: 1.1rem; cursor: pointer; display: flex; align-items: center;
      justify-content: center; padding: 0; font-family: inherit;
    }
    .pl-empty {
      text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 0.9rem;
      border: 1.5px dashed var(--border); border-radius: 8px; margin-bottom: 0.85rem; line-height: 1.6;
    }
    /* Finance fields for merch/tracts */
    .pl-finance {
      padding: 0.6rem 0.85rem; margin: -0.25rem 0 0.5rem; background: var(--gold-soft);
      border: 1px solid #f0e0b0; border-radius: 8px; font-size: 0.82rem;
      display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: center;
    }
    .pl-finance select, .pl-finance input {
      padding: 0.4rem 0.55rem; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.82rem; font-family: inherit; flex: 1; min-width: 90px; margin: 0; background: var(--card);
    }
    .pl-finance__skip {
      padding: 0.35rem 0.6rem; background: var(--card); border: 1px solid var(--border);
      border-radius: 6px; font-size: 0.72rem; font-weight: 600; cursor: pointer;
      font-family: inherit; color: var(--muted); white-space: nowrap;
    }
    .pl-finance__skip:hover { border-color: var(--gold); color: var(--gold); }
    .pl-finance__skipped { font-size: 0.75rem; color: var(--muted); font-style: italic; flex: 1; }
    .pl-finance__unskip { padding: 0.3rem 0.5rem; background: none; border: 1px solid var(--gold); border-radius: 5px; font-size: 0.7rem; color: var(--gold); cursor: pointer; font-family: inherit; }

    /* Buttons */
    .add-btn {
      width: 100%; padding: 0.8rem; background: var(--card); border: 1.5px dashed var(--gold);
      border-radius: 8px; color: var(--gold); font-weight: 600; font-size: 0.9rem;
      cursor: pointer; font-family: inherit; margin-bottom: 1.25rem;
    }
    .add-btn:hover { background: var(--gold-soft); }
    .submit-btn {
      width: 100%; padding: 1rem; background: var(--gold); color: #fff; border: none;
      border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
      font-family: inherit; min-height: 50px;
    }
    .submit-btn:hover { background: #9a7209; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #pl-status { text-align: center; margin-top: 0.85rem; font-size: 0.9rem; line-height: 1.6; min-height: 1.4rem; }

    /* QR Confirm banner */
    .qr-confirm {
      display: none; padding: 1rem; background: var(--green-soft); border: 1.5px solid var(--green);
      border-radius: 8px; margin-top: 0.75rem; text-align: center;
    }
    .qr-confirm.active { display: block; }
    .qr-confirm__name { font-weight: 700; font-size: 1rem; color: var(--ink); margin: 0 0 0.5rem; }
    .qr-confirm__id { font-family: var(--mono); font-size: 0.72rem; color: var(--gold); margin: 0 0 0.75rem; }
    .qr-confirm__actions { display: flex; gap: 0.5rem; justify-content: center; }
    .qr-confirm__btn {
      padding: 0.6rem 1.25rem; border-radius: 8px; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; font-family: inherit; border: none;
    }
    .qr-confirm__btn--add { background: var(--green); color: #fff; }
    .qr-confirm__btn--add:hover { background: #146016; }
    .qr-confirm__btn--cancel { background: var(--card); border: 1.5px solid var(--border); color: var(--muted); }
    .qr-confirm__btn--cancel:hover { border-color: var(--red); color: var(--red); }
    .qr-confirm__btn--rescan { background: var(--gold-soft); border: 1.5px solid var(--gold); color: var(--gold); margin-top: 0.5rem; width: 100%; }
    .qr-confirm__btn--rescan:hover { background: var(--gold); color: #fff; }

    /* Manual add picker modal */
    .picker-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      z-index: 200; align-items: flex-end; justify-content: center; padding: 0;
    }
    .picker-overlay.active { display: flex; }
    .picker-sheet {
      background: var(--card); border-radius: 16px 16px 0 0; width: 100%; max-width: 520px;
      max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 -4px 30px rgba(0,0,0,0.15);
    }
    .picker-header {
      display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .picker-header__title { font-weight: 700; font-size: 1rem; margin: 0; }
    .picker-header__close {
      width: 32px; height: 32px; border-radius: 50%; background: var(--bg); border: 1px solid var(--border);
      font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-family: inherit;
    }
    .picker-header__close:hover { border-color: var(--red); color: var(--red); }
    .picker-search {
      margin: 0.75rem 1.25rem; padding: 0.7rem 0.85rem; border: 1.5px solid var(--border);
      border-radius: 8px; font-size: 0.9rem; font-family: inherit; background: var(--bg); width: calc(100% - 2.5rem);
    }
    .picker-search:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(184,134,11,0.12); }
    .picker-list {
      flex: 1; overflow-y: auto; padding: 0.5rem 1.25rem 1.25rem; -webkit-overflow-scrolling: touch;
    }
    .picker-item {
      display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 0.85rem;
      border: 1.5px solid var(--border); border-radius: 8px; margin-bottom: 0.5rem; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .picker-item:hover { border-color: var(--gold); background: var(--gold-soft); }
    .picker-item__name { font-weight: 600; font-size: 0.88rem; color: var(--ink); }
    .picker-item__meta { font-family: var(--mono); font-size: 0.68rem; color: var(--muted); }
    .picker-item__cost { font-size: 0.72rem; color: var(--gold); font-weight: 600; }
  </style>
</head>
<body>
<!-- Gate -->
<div class="gate" id="gate">
  <div class="gate__card">
    <div class="gate__icon">📋</div>
    <h1 class="gate__title">Field Log</h1>
    <p class="gate__hint">Seed the Word admin access. Enter your passphrase to continue.</p>
    <div class="gate__error" id="gate-error"></div>
    <input type="password" class="gate__input" id="gate-input" placeholder="Passphrase" autocomplete="current-password">
    <button class="gate__btn" id="gate-btn">Unlock</button>
  </div>
</div>

<!-- Shell -->
<div class="shell" id="shell">
  <header class="header">
    <div>
      <p class="header__title">Field Log</p>
      <p class="header__sub">Seed the Word &mdash; Placement Record</p>
    </div>
    <button class="logout-btn" id="logout-btn">Lock</button>
  </header>

  <div class="form-wrap">
    <p class="section-label">QR Scanner</p>
    <div class="qr-section">
      <button type="button" class="qr-toggle" id="qr-toggle-btn">📷 Scan Scripture QR</button>
      <div id="qr-reader"></div>
      <div class="qr-status" id="qr-status">Scan a QR code to auto-add items below.</div>
      <!-- Confirmation banner after scan -->
      <div class="qr-confirm" id="qr-confirm">
        <p class="qr-confirm__name" id="qr-confirm-name"></p>
        <p class="qr-confirm__id" id="qr-confirm-id"></p>
        <div class="qr-confirm__actions">
          <button type="button" class="qr-confirm__btn qr-confirm__btn--add" id="qr-confirm-add">Add to Inventory</button>
          <button type="button" class="qr-confirm__btn qr-confirm__btn--cancel" id="qr-confirm-cancel">Discard</button>
        </div>
        <button type="button" class="qr-confirm__btn qr-confirm__btn--rescan" id="qr-confirm-rescan">📷 Scan Another</button>
      </div>
    </div>

    <p class="section-label">Placement Details</p>
    <label>Placement Name *</label>
    <input type="text" id="pl-name" placeholder="e.g. Sam Petrov Community Cookout July 25">

    <label>Institution / Location *</label>
    <input type="text" id="pl-institution" placeholder="e.g. Wiggums Hollow Park">

    <label>Address</label>
    <input type="text" id="pl-address" placeholder="Street, City, State">

    <div class="row2">
      <div><label>Date Placed *</label><input type="date" id="pl-date"></div>
      <div><label>Team Member</label><input type="text" id="pl-team" placeholder="Your name"></div>
    </div>

    <label>Event Source</label>
    <input type="text" id="pl-event-source" placeholder="Community Cookout">

    <label>Notes</label>
    <textarea id="pl-notes" rows="2" placeholder="Optional..."></textarea>
    <p class="section-label">Scriptures Placed</p>
    <div id="pl-items"></div>
    <div class="pl-empty" id="pl-empty">No items yet.<br>Scan a QR code or tap "Add Manually" below.</div>
    <button type="button" class="add-btn" id="pl-add-btn">+ Add Scripture Manually</button>

    <button class="submit-btn" id="pl-submit-btn">Save Placement Record</button>
    <div id="pl-status"></div>
  </div>
</div>

<!-- Item Picker Modal -->
<div class="picker-overlay" id="picker-overlay">
  <div class="picker-sheet">
    <div class="picker-header">
      <h2 class="picker-header__title">Add Scripture / Item</h2>
      <button type="button" class="picker-header__close" id="picker-close">&times;</button>
    </div>
    <input type="text" class="picker-search" id="picker-search" placeholder="Search items...">
    <div class="picker-list" id="picker-list"></div>
  </div>
</div>

<script>
(function() {
  'use strict';

  var SALT          = 'stwm-2026-admin-gate';
  var EXPECTED_HASH = '2e3df09a3a06ebdacb4cf637764073674243ed9497da164c94a955f7ae931440';
  var SESSION_KEY   = 'stwm-admin-unlocked';

  var gate = document.getElementById('gate');
  var shell = document.getElementById('shell');
  var gateErr = document.getElementById('gate-error');
  var gateIn = document.getElementById('gate-input');
  var gateBtn = document.getElementById('gate-btn');
  var logout = document.getElementById('logout-btn');
  var TYPES = [
    ['Pocket Personal Testimony Gideon Red','pocket-nt-red'],
    ['Pocket Friend of Gideon Grey','pocket-nt-grey'],
    ['Pocket Spanish Gideon','pocket-nt-spanish'],
    ['Large Print Gideon Brown','large-print-nt-brown'],
    ['Pocket Hindi Gideon','pocket-nt-hindi-blue'],
    ['Large Print Russian','large-print-nt-russian'],
    ['Large Print Ukranian','large-print-nt-ukrainian'],
    ['Pocket Farsi Persian','pocket-nt-farsi-blue'],
    ['Full Bible Large Print','full-bible-large-print'],
    ['Full Bible Pocket','full-bible-pocket'],
    ['Large Print Thai + English Gideon','pocket-nt-thai-english-blue'],
    ['Pocket Mandarin Gideon','pocket-nt-mandarin'],
    ['Large Print Urdu Gideon','large-print-nt-urdu-blue'],
    ['Large Print Spanish + English Gideon','large-print-nt-spanish-english'],
    ['Large Print Arabic + English','large-print-nt-arabic-english'],
    ['Pocket Arabic','pocket-nt-arabic'],
    ['Pocket French Gideon','pocket-nt-french'],
    ['Life Book English','tract-life-book-english'],
    ['Life Book Spanish','tract-life-book-spanish'],
    ['Flip Books','tract-flip-books-english'],
    ['Notebooks & Pens','merch-notebooks-pens'],
    ['Keychains & Bracelets','merch-keychains-bracelets'],
    ['Stickers','merch-stickers'],
    ['Mini Jesus figurines','merch-mini-fig'],
    ['Bookmarks','merch-bookmarks']
  ];

  var COST_MAP = {
    'pocket-nt-red':2,'pocket-nt-grey':2,'pocket-nt-spanish':2,'large-print-nt-brown':3.1,
    'pocket-nt-hindi-blue':2,'large-print-nt-russian':2,'large-print-nt-ukrainian':2,
    'pocket-nt-farsi-blue':2,'large-print-nt-urdu-blue':6.7,'full-bible-large-print':5,
    'full-bible-pocket':5,'pocket-nt-thai-english-blue':5,'pocket-nt-mandarin':5,
    'large-print-nt-spanish-english':5,'large-print-nt-arabic-english':5,
    'pocket-nt-arabic':2,'pocket-nt-french':2,'tract-life-book-english':0,
    'tract-life-book-spanish':0,'tract-flip-books-english':0,'merch-notebooks-pens':0.27,
    'merch-keychains-bracelets':0.25,'merch-stickers':0.05,'merch-mini-fig':0.1,'merch-bookmarks':0.12
  };

  function getItemCost(id) { return COST_MAP[id] !== undefined ? COST_MAP[id] : 2; }
  function isBible(id) { return id.indexOf('pocket-')===0||id.indexOf('full-')===0||id.indexOf('large-')===0; }
  function findTypeById(id) { for(var i=0;i<TYPES.length;i++){if(TYPES[i][1]===id)return TYPES[i];}return null; }
  function findTypeByName(n) { for(var i=0;i<TYPES.length;i++){if(TYPES[i][0]===n)return TYPES[i];}return null; }
  var METHODS = ['Cash','Card','Zelle','Venmo','CashApp','PayPal','Apple/Google/Samsung Pay','Invoice/Unpaid'];
  // Gate logic
  async function sha256(text) {
    var buf = new TextEncoder().encode(text);
    var digest = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(digest)).map(function(b){return b.toString(16).padStart(2,'0');}).join('');
  }
  function unlock() {
    gate.style.display = 'none';
    shell.classList.add('visible');
    document.getElementById('pl-date').valueAsDate = new Date();
    // Event Mode: restore previous session's event details if same day
    try {
      var saved = JSON.parse(sessionStorage.getItem('stwm-event-mode') || 'null');
      if (saved && saved.date === new Date().toISOString().split('T')[0]) {
        document.getElementById('pl-name').value = saved.name || '';
        document.getElementById('pl-institution').value = saved.institution || '';
        document.getElementById('pl-address').value = saved.address || '';
        document.getElementById('pl-event-source').value = saved.source || '';
        document.getElementById('pl-team').value = saved.team || '';
        // Show a banner
        var banner = document.createElement('div');
        banner.style.cssText = 'padding:0.6rem 1rem;background:#fff8e8;border:1px solid #f0e0b0;border-radius:8px;margin-bottom:1rem;font-size:0.82rem;text-align:center;';
        banner.innerHTML = '⚡ <strong>Event Mode:</strong> Continuing "' + (saved.name||'event') + '" — <a href="#" style="color:var(--gold);" onclick="clearEventMode();return false;">Start fresh</a>';
        document.querySelector('.form-wrap').insertBefore(banner, document.querySelector('.form-wrap').firstChild);
      }
    } catch(e) {}
  }
  // Save event details on successful submission for event mode
  function saveEventMode() {
    var eventData = {
      date: new Date().toISOString().split('T')[0],
      name: document.getElementById('pl-name').value,
      institution: document.getElementById('pl-institution').value,
      address: document.getElementById('pl-address').value,
      source: document.getElementById('pl-event-source').value,
      team: document.getElementById('pl-team').value
    };
    try { sessionStorage.setItem('stwm-event-mode', JSON.stringify(eventData)); } catch(e) {}
    // Also set active event on server so checkout.html knows
    (async function() {
      try {
        var cfg = await fetch('../assets/data/site-config.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();});
        if (cfg.orderHandlerUrl) {
          fetch(cfg.orderHandlerUrl, {method:'POST',mode:'cors',headers:{'Content-Type':'text/plain;charset=utf-8'},
            body:JSON.stringify({action:'setActiveEvent',passphrase_hash:EXPECTED_HASH,
              event_id:(eventData.source||eventData.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-'),
              event_label:eventData.name||eventData.institution||'',
              set_by:eventData.team||''})});
        }
      } catch(e) {}
    })();
  }
  window.clearEventMode = function() {
    try { sessionStorage.removeItem('stwm-event-mode'); } catch(e) {}
    location.reload();
  };
  function lock() { try{sessionStorage.removeItem(SESSION_KEY);}catch(e){}location.reload(); }
  try{if(sessionStorage.getItem(SESSION_KEY)==='1')unlock();}catch(e){}
  gateBtn.addEventListener('click', async function() {
    gateErr.textContent='';
    var pass=gateIn.value;
    if(!pass){gateErr.textContent='Enter your passphrase.';return;}
    gateBtn.textContent='Checking...';
    var hash=await sha256(SALT+pass);
    if(hash===EXPECTED_HASH){try{sessionStorage.setItem(SESSION_KEY,'1');}catch(e){}unlock();}
    else{gateErr.textContent='Incorrect passphrase.';gateIn.value='';gateIn.focus();gateBtn.textContent='Unlock';}
  });
  gateIn.addEventListener('keydown',function(e){if(e.key==='Enter')gateBtn.click();});
  logout.addEventListener('click', lock);

  // Placement items
  var plItems = [];

  function renderPlItems() {
    var container = document.getElementById('pl-items');
    var empty = document.getElementById('pl-empty');
    if (!plItems.length) { container.innerHTML=''; empty.style.display=''; return; }
    empty.style.display='none';
    var html = '';
    plItems.forEach(function(item, idx) {
      var needsFin = !isBible(item.item_id) && getItemCost(item.item_id) > 0;
      html += '<div class="pl-item"><div><div class="pl-item__name">'+item.item_name+'</div>' +
        '<div class="pl-item__id">'+item.item_id+'</div>' +
        '<div class="pl-item__cost">$'+getItemCost(item.item_id).toFixed(2)+'/ea</div></div>' +
        '<input type="number" class="pl-item__qty" min="1" value="'+item.qty+'" data-idx="'+idx+'">' +
        '<button type="button" class="pl-item__rm" data-idx="'+idx+'">\u00d7</button></div>';
      if (needsFin && !item.skip_finance) {
        var pmOpts = METHODS.map(function(m){var s=item.payment_method===m?' selected':'';return '<option value="'+m+'"'+s+'>'+m+'</option>';}).join('');
        html += '<div class="pl-finance"><select data-idx="'+idx+'" class="pf-pm"><option value="">Payment *</option>'+pmOpts+'</select>' +
          '<input class="pf-rb" data-idx="'+idx+'" placeholder="Recorded by" value="'+(item.recorded_by||'')+'">' +
          '<button type="button" class="pl-finance__skip" data-idx="'+idx+'">Skip</button></div>';
      } else if (needsFin && item.skip_finance) {
        html += '<div class="pl-finance"><span class="pl-finance__skipped">Skipped</span>' +
          '<button type="button" class="pl-finance__unskip" data-idx="'+idx+'">Undo</button></div>';
      }
    });
    container.innerHTML = html;
    container.querySelectorAll('.pl-item__qty').forEach(function(inp){
      inp.addEventListener('change',function(){plItems[+this.dataset.idx].qty=+this.value||1;});
    });
    container.querySelectorAll('.pl-item__rm').forEach(function(btn){
      btn.addEventListener('click',function(){plItems.splice(+this.dataset.idx,1);renderPlItems();});
    });
    container.querySelectorAll('.pf-pm').forEach(function(sel){
      sel.addEventListener('change',function(){plItems[+this.dataset.idx].payment_method=this.value;});
    });
    container.querySelectorAll('.pf-rb').forEach(function(inp){
      inp.addEventListener('input',function(){plItems[+this.dataset.idx].recorded_by=this.value;});
    });
    container.querySelectorAll('.pl-finance__skip').forEach(function(btn){
      btn.addEventListener('click',function(){plItems[+this.dataset.idx].skip_finance=true;renderPlItems();});
    });
    container.querySelectorAll('.pl-finance__unskip').forEach(function(btn){
      btn.addEventListener('click',function(){plItems[+this.dataset.idx].skip_finance=false;renderPlItems();});
    });
  }

  function addPlItem(itemId, itemName, qty) {
    for (var i=0;i<plItems.length;i++){if(plItems[i].item_id===itemId){plItems[i].qty+=(qty||1);renderPlItems();return;}}
    plItems.push({item_id:itemId,item_name:itemName,qty:qty||1,payment_method:'',recorded_by:'',skip_finance:false});
    renderPlItems();
  }

  // Manual add — opens picker modal
  document.getElementById('pl-add-btn').addEventListener('click', function() {
    openPicker();
  });

  function openPicker() {
    var overlay = document.getElementById('picker-overlay');
    var list = document.getElementById('picker-list');
    var search = document.getElementById('picker-search');
    search.value = '';
    renderPickerList('');
    overlay.classList.add('active');
    setTimeout(function(){ search.focus(); }, 100);
  }

  function renderPickerList(filter) {
    var list = document.getElementById('picker-list');
    var q = filter.toLowerCase();
    var html = '';
    TYPES.forEach(function(t, i) {
      var name = t[0], id = t[1];
      if (q && name.toLowerCase().indexOf(q) === -1 && id.toLowerCase().indexOf(q) === -1) return;
      var cost = getItemCost(id);
      html += '<div class="picker-item" data-idx="'+i+'">' +
        '<div><div class="picker-item__name">'+name+'</div><div class="picker-item__meta">'+id+'</div></div>' +
        '<div class="picker-item__cost">$'+cost.toFixed(2)+'</div></div>';
    });
    if (!html) html = '<p style="text-align:center;color:var(--muted);padding:2rem 0;font-size:0.9rem;">No items match your search.</p>';
    list.innerHTML = html;
    list.querySelectorAll('.picker-item').forEach(function(el) {
      el.addEventListener('click', function() {
        var idx = +this.dataset.idx;
        addPlItem(TYPES[idx][1], TYPES[idx][0], 1);
        closePicker();
      });
    });
  }

  function closePicker() {
    document.getElementById('picker-overlay').classList.remove('active');
  }

  document.getElementById('picker-close').addEventListener('click', closePicker);
  document.getElementById('picker-overlay').addEventListener('click', function(e) {
    if (e.target === this) closePicker();
  });
  document.getElementById('picker-search').addEventListener('input', function() {
    renderPickerList(this.value);
  });

  // QR Scanner — stops after one scan, shows confirmation
  var qrScanner=null, qrActive=false;
  var pendingScan = null; // {item_id, item_name}

  document.getElementById('qr-toggle-btn').addEventListener('click', function() {
    if (qrActive){stopQr();return;}
    if (!window.Html5Qrcode) {
      var s=document.createElement('script');
      s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
      s.onload=startQr; s.onerror=function(){document.getElementById('qr-status').textContent='Failed to load scanner.';};
      document.head.appendChild(s);
    } else startQr();
  });

  function startQr() {
    var reader=document.getElementById('qr-reader'), status=document.getElementById('qr-status'), btn=document.getElementById('qr-toggle-btn');
    var confirm=document.getElementById('qr-confirm');
    confirm.classList.remove('active');
    pendingScan = null;
    reader.classList.add('active'); btn.textContent='\u23f9 Stop Scanner'; status.textContent='Initializing camera...'; status.className='qr-status';
    qrScanner=new Html5Qrcode('qr-reader'); qrActive=true;
    qrScanner.start({facingMode:'environment'},{fps:10,qrbox:{width:200,height:200}},
      function(decoded){
        // Stop scanning immediately on first detection
        stopQr();
        var itemId=decoded.trim();
        if(itemId.indexOf('http')===0){try{var u=new URL(itemId);itemId=u.searchParams.get('item')||u.searchParams.get('id')||u.pathname.split('/').pop()||itemId;}catch(e){}}
        var found=findTypeById(itemId)||findTypeByName(itemId);
        if(found){
          // Show confirmation instead of auto-adding
          pendingScan = {item_id: found[1], item_name: found[0]};
          showScanConfirm(found[0], found[1]);
          if(navigator.vibrate)navigator.vibrate(100);
        } else {
          status.textContent='\u26a0\ufe0f Unknown QR: '+itemId;status.className='qr-status error';
        }
      },function(){}
    ).catch(function(err){status.textContent='Camera error: '+(err.message||err);status.className='qr-status error';qrActive=false;reader.classList.remove('active');btn.textContent='\ud83d\udcf7 Scan Scripture QR';});
  }

  function stopQr(){
    var reader=document.getElementById('qr-reader'),btn=document.getElementById('qr-toggle-btn'),status=document.getElementById('qr-status');
    if(qrScanner){try{qrScanner.stop().then(function(){try{qrScanner.clear();}catch(e){}}).catch(function(){});}catch(e){}}
    qrActive=false;reader.classList.remove('active');btn.textContent='\ud83d\udcf7 Scan Scripture QR';
    if(!pendingScan) { status.textContent='Scanner stopped.';status.className='qr-status'; }
  }

  function showScanConfirm(name, id) {
    var confirm = document.getElementById('qr-confirm');
    var status = document.getElementById('qr-status');
    document.getElementById('qr-confirm-name').textContent = name;
    document.getElementById('qr-confirm-id').textContent = id;
    confirm.classList.add('active');
    status.textContent = '\u2705 Scanned! Confirm below.';
    status.className = 'qr-status success';
  }

  function hideScanConfirm() {
    document.getElementById('qr-confirm').classList.remove('active');
    pendingScan = null;
  }

  document.getElementById('qr-confirm-add').addEventListener('click', function() {
    if (pendingScan) {
      addPlItem(pendingScan.item_id, pendingScan.item_name, 1);
      document.getElementById('qr-status').textContent = '\u2705 Added: ' + pendingScan.item_name;
    }
    hideScanConfirm();
  });

  document.getElementById('qr-confirm-cancel').addEventListener('click', function() {
    document.getElementById('qr-status').textContent = 'Scan discarded.';
    document.getElementById('qr-status').className = 'qr-status';
    hideScanConfirm();
  });

  document.getElementById('qr-confirm-rescan').addEventListener('click', function() {
    hideScanConfirm();
    startQr();
  });
  // Submit placement
  document.getElementById('pl-submit-btn').addEventListener('click', async function() {
    var btn=this, status=document.getElementById('pl-status');
    status.innerHTML='';
    var plName=document.getElementById('pl-name').value.trim();
    var institution=document.getElementById('pl-institution').value.trim();
    var plDate=document.getElementById('pl-date').value;
    if(!plName){status.innerHTML='<span style="color:var(--red)">Placement Name required.</span>';return;}
    if(!institution){status.innerHTML='<span style="color:var(--red)">Institution required.</span>';return;}
    if(!plDate){status.innerHTML='<span style="color:var(--red)">Date required.</span>';return;}
    if(!plItems.length){status.innerHTML='<span style="color:var(--red)">Add at least one item.</span>';return;}
    for(var v=0;v<plItems.length;v++){
      var vi=plItems[v];
      if(!isBible(vi.item_id)&&getItemCost(vi.item_id)>0&&!vi.skip_finance&&!vi.payment_method){
        status.innerHTML='<span style="color:var(--red)">Payment method needed for "'+vi.item_name+'" or tap Skip.</span>';return;
      }
    }
    btn.disabled=true;btn.textContent='Saving...';
    try {
      var cfg=await fetch('../assets/data/site-config.json?t='+Date.now(),{cache:'no-store'}).then(function(r){return r.json();});
      var url=cfg.orderHandlerUrl; if(!url)throw new Error('No handler URL');
      var body=JSON.stringify({
        action:'fieldPlacement', passphrase_hash:EXPECTED_HASH,
        placement:{placementName:plName,institution:institution,address:document.getElementById('pl-address').value.trim(),
          date_placed:plDate,team_member:document.getElementById('pl-team').value.trim(),
          event_source:document.getElementById('pl-event-source').value.trim(),notes:document.getElementById('pl-notes').value.trim(),
          official_name:'',contact_phone:'',contact_email:'',num_rooms:''},
        items:plItems.map(function(it){return{item_id:it.item_id,item_name:it.item_name,qty:it.qty,direction:'out',
          cost_per_unit:getItemCost(it.item_id),payment_method:it.payment_method||'',recorded_by:it.recorded_by||'',skip_finance:!!it.skip_finance};})
      });
      var res=await fetch(url,{method:'POST',mode:'cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:body});
      var json=await res.json();
      if(json.ok){
        status.innerHTML='<span style="color:var(--green)">\u2705 Saved! ID: '+(json.placement_id||'')+'</span>';
        saveEventMode();
        plItems=[];renderPlItems();
        ['pl-name','pl-institution','pl-address','pl-team','pl-event-source','pl-notes'].forEach(function(id){document.getElementById(id).value='';});
        document.getElementById('pl-date').valueAsDate=new Date();
      } else throw new Error(json.error||'Error');
    } catch(err){status.innerHTML='<span style="color:var(--red)">\u274c '+(err.message||err)+'</span>';}
    btn.disabled=false;btn.textContent='Save Placement Record';
  });
})();
</script>
</body>
</html>
