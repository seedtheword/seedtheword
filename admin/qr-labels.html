<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>QR Labels — Seed the Word</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    :root {
      --serif: 'Playfair Display', Georgia, serif;
      --sans: 'Source Sans 3', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', monospace;
      --bg: #FAFAF8; --card: #FFFFFF; --ink: #1A1A1A;
      --muted: #6B6B6B; --gold: #B8860B; --border: #E8E4DF;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; font-family: var(--sans); background: var(--bg); color: var(--ink); }
    .page-header {
      max-width: 800px; margin: 0 auto; padding: 2rem 1.5rem 1rem;
    }
    .page-header h1 { font-family: var(--serif); font-size: 1.6rem; font-weight: 400; margin: 0 0 0.5rem; }
    .page-header p { font-size: 0.9rem; color: var(--muted); line-height: 1.6; margin: 0 0 1.25rem; }
    .toolbar {
      display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center;
      padding: 0.85rem 1rem; background: var(--card); border: 1px solid var(--border);
      border-radius: 8px; margin-bottom: 1.25rem;
    }
    .toolbar__btn {
      padding: 0.6rem 1.1rem; background: var(--gold); color: #fff; border: none;
      border-radius: 6px; font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: inherit;
    }
    .toolbar__btn:hover { background: #9a7209; }
    .toolbar__btn--outline { background: none; color: var(--ink); border: 1.5px solid var(--border); }
    .toolbar__btn--outline:hover { border-color: var(--gold); color: var(--gold); background: none; }
    .toolbar select {
      padding: 0.45rem 0.7rem; border: 1px solid var(--border); border-radius: 6px;
      font-size: 0.82rem; font-family: inherit; background: var(--card);
    }
    .toolbar__count { font-family: var(--mono); font-size: 0.78rem; color: var(--gold); font-weight: 500; }

    .label-grid {
      max-width: 800px; margin: 0 auto; padding: 0 1rem 3rem;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--lw,160px), 1fr)); gap: 0.65rem;
    }
    .label {
      background: var(--card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.75rem; display: flex; flex-direction: column; align-items: center;
      gap: 0.35rem; text-align: center; cursor: pointer; position: relative;
      transition: border-color 0.15s, opacity 0.15s; break-inside: avoid;
    }
    .label:hover { border-color: var(--gold); }
    .label.selected { border-color: var(--gold); background: #FFFCF5; }
    .label.unselected { opacity: 0.4; }
    .label__check { position: absolute; top: 0.5rem; right: 0.5rem; width: 16px; height: 16px; accent-color: var(--gold); }
    .label__qr { width: var(--qs,90px); height: var(--qs,90px); } .label__qr svg { width:100%; height:100%; }
    .label__name { font-size: 0.7rem; font-weight: 600; color: var(--ink); line-height: 1.3; }
    .label__id { font-family: var(--mono); font-size: 0.6rem; color: var(--gold); }
    .label__qty-wrap { display: flex; align-items: center; gap: 0.25rem; }
    .label__qty-lbl { font-size: 0.6rem; color: var(--muted); }
    .label__qty { width: 36px; padding: 0.2rem; border: 1px solid var(--border); border-radius: 4px; font-size: 0.7rem; text-align: center; }
    @media print {
      .page-header, .toolbar { display: none; }
      body { background: #fff; }
      .label-grid { max-width:100%; padding:0; margin:0; gap:2mm; grid-template-columns:repeat(var(--cols,5),1fr); }
      .label { border:0.5px solid #ccc; border-radius:2px; padding:3mm; }
      .label.unselected { display:none !important; }
      .label__check, .label__qty-wrap { display:none; }
      .label__qr { width:var(--pqs,18mm); height:var(--pqs,18mm); }
      .label__name { font-size:6pt; } .label__id { font-size:5pt; }
    }
    .label-grid[data-size="small"] { --lw:120px; --qs:70px; --pqs:14mm; --cols:6; }
    .label-grid[data-size="medium"] { --lw:160px; --qs:100px; --pqs:20mm; --cols:5; }
    .label-grid[data-size="large"] { --lw:200px; --qs:130px; --pqs:28mm; --cols:4; }
  </style>
</head>
<body>
<div class="page-header">
  <h1>Scripture QR Labels</h1>
  <p>Select the labels you need, set quantity, and print. Stick them on Bible boxes or individual copies. The Field Log app scans these to auto-build placement records.</p>
</div>
<div class="toolbar">
  <button class="toolbar__btn" onclick="printSelected()">Print Selected</button>
  <button class="toolbar__btn--outline toolbar__btn" onclick="toggleAll()">Select All</button>
  <select onchange="setSize(this.value)">
    <option value="small">Small</option>
    <option value="medium" selected>Medium</option>
    <option value="large">Large</option>
  </select>
  <span class="toolbar__count" id="sel-count">0 selected</span>
</div>
<div class="label-grid" id="grid" data-size="medium"></div>
<script src="https://unpkg.com/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
(function(){
  var BASE='https://seedtheword.org/donate.html?item=';
  var TYPES=[
    ['Pocket Personal Testimony Gideon Red','pocket-nt-red'],['Pocket Friend of Gideon Grey','pocket-nt-grey'],
    ['Pocket Spanish Gideon','pocket-nt-spanish'],['Large Print Gideon Brown','large-print-nt-brown'],
    ['Pocket Hindi Gideon','pocket-nt-hindi-blue'],['Large Print Russian','large-print-nt-russian'],
    ['Large Print Ukranian','large-print-nt-ukrainian'],['Pocket Farsi Persian','pocket-nt-farsi-blue'],
    ['Full Bible Large Print','full-bible-large-print'],['Full Bible Pocket','full-bible-pocket'],
    ['Large Print Thai + English Gideon','pocket-nt-thai-english-blue'],['Pocket Mandarin Gideon','pocket-nt-mandarin'],
    ['Large Print Urdu Gideon','large-print-nt-urdu-blue'],['Large Print Spanish + English Gideon','large-print-nt-spanish-english'],
    ['Large Print Arabic + English','large-print-nt-arabic-english'],['Pocket Arabic','pocket-nt-arabic'],
    ['Pocket French Gideon','pocket-nt-french'],['Life Book English','tract-life-book-english'],
    ['Life Book Spanish','tract-life-book-spanish'],['Flip Books','tract-flip-books-english'],
    ['Notebooks & Pens','merch-notebooks-pens'],['Keychains & Bracelets','merch-keychains-bracelets'],
    ['Stickers','merch-stickers'],['Mini Jesus figurines','merch-mini-fig'],['Bookmarks','merch-bookmarks']
  ];
  var grid=document.getElementById('grid');
  function genSvg(t){var q=qrcode(0,'M');q.addData(t);q.make();return q.createSvgTag({scalable:true});}
  function render(){
    grid.innerHTML=TYPES.map(function(t,i){
      var url=BASE+encodeURIComponent(t[1]);
      return '<div class="label unselected" data-i="'+i+'">' +
        '<input type="checkbox" class="label__check" data-i="'+i+'">' +
        '<div class="label__qr">'+genSvg(url)+'</div>' +
        '<div class="label__name">'+t[0]+'</div><div class="label__id">'+t[1]+'</div>' +
        '<div class="label__qty-wrap"><span class="label__qty-lbl">Qty</span><input type="number" class="label__qty" min="1" value="1"></div>' +
      '</div>';
    }).join('');
    grid.querySelectorAll('.label').forEach(function(el){
      el.addEventListener('click',function(e){
        if(e.target.classList.contains('label__qty'))return;
        var cb=el.querySelector('.label__check');
        if(e.target!==cb)cb.checked=!cb.checked;
        el.classList.toggle('unselected',!cb.checked);
        el.classList.toggle('selected',cb.checked);
        updCount();
      });
    });
  }
  function updCount(){
    var n=grid.querySelectorAll('.label__check:checked').length;
    document.getElementById('sel-count').textContent=n+' selected';
  }
  render();

  var allSel=false;
  window.toggleAll=function(){
    allSel=!allSel;
    grid.querySelectorAll('.label').forEach(function(el){
      el.querySelector('.label__check').checked=allSel;
      el.classList.toggle('unselected',!allSel);
      el.classList.toggle('selected',allSel);
    });updCount();
  };
  window.setSize=function(s){grid.dataset.size=s;};
  window.printSelected=function(){
    var sel=grid.querySelectorAll('.label__check:checked');
    if(!sel.length){alert('Select at least one label.');return;}
    var dupes=[];
    sel.forEach(function(cb){
      var el=cb.closest('.label'),qty=+(el.querySelector('.label__qty').value)||1;
      for(var i=1;i<qty;i++){var c=el.cloneNode(true);c.classList.remove('unselected');c.classList.add('selected');c.querySelector('.label__check').remove();c.querySelector('.label__qty-wrap').remove();grid.appendChild(c);dupes.push(c);}
    });
    window.print();
    setTimeout(function(){dupes.forEach(function(d){d.remove();});},500);
  };
})();
</script>
</body>
</html>
