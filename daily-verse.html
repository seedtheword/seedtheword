<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Verse — Seed the Word Ministry</title>
  <link rel="stylesheet" href="assets/css/main.css">
</head>
<body>

<div class="daily-verse-page">
  <div class="daily-verse-container">
    <a href="index.html" class="daily-verse-logo">
      <img src="assets/images/stw-logo.jpg" alt="Seed the Word">
    </a>
    
    <div class="daily-verse-content">
      <p class="daily-verse-label">Today's Verse</p>
      <blockquote class="daily-verse-text" id="verse-text">
        "For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life."
      </blockquote>
      <p class="daily-verse-reference" id="verse-reference">— John 3:16</p>
    </div>
    
    <div class="daily-verse-actions">
      <button class="btn btn-secondary" id="share-verse">Share This Verse</button>
      <button class="btn btn-outline-gold" id="new-verse">New Verse</button>
    </div>
    
    <a href="index.html" class="daily-verse-back">← Back to Home</a>
  </div>
</div>

<script>
// Array of verses
const verses = [
  { text: "For God so loved the world that he gave his one and only Son, that whoever believes in him shall not perish but have eternal life.", ref: "John 3:16" },
  { text: "Trust in the LORD with all your heart and lean not on your own understanding; in all your ways submit to him, and he will make your paths straight.", ref: "Proverbs 3:5-6" },
  { text: "I can do all this through him who gives me strength.", ref: "Philippians 4:13" },
  { text: "The LORD is my shepherd, I lack nothing. He makes me lie down in green pastures, he leads me beside quiet waters, he refreshes my soul.", ref: "Psalm 23:1-3" },
  { text: "And we know that in all things God works for the good of those who love him, who have been called according to his purpose.", ref: "Romans 8:28" },
  { text: "Be strong and courageous. Do not be afraid; do not be discouraged, for the LORD your God will be with you wherever you go.", ref: "Joshua 1:9" },
  { text: "In the beginning was the Word, and the Word was with God, and the Word was God.", ref: "John 1:1" },
  { text: "Therefore go and make disciples of all nations, baptizing them in the name of the Father and of the Son and of the Holy Spirit.", ref: "Matthew 28:19" },
  { text: "I planted the seed, Apollos watered it, but God has been making it grow.", ref: "1 Corinthians 3:6" },
  { text: "Let us not become weary in doing good, for at the proper time we will reap a harvest if we do not give up.", ref: "Galatians 6:9" }
];

// Get day of year to show consistent verse per day
function getDayOfYear() {
  const now = new Date();
  const start = new Date(now.getFullYear(), 0, 0);
  const diff = now - start;
  const oneDay = 1000 * 60 * 60 * 24;
  return Math.floor(diff / oneDay);
}

// Load verse
function loadVerse(random = false) {
  const index = random ? Math.floor(Math.random() * verses.length) : getDayOfYear() % verses.length;
  const verse = verses[index];
  document.getElementById('verse-text').textContent = `"${verse.text}"`;
  document.getElementById('verse-reference').textContent = `— ${verse.ref}`;
}

// Share verse
document.getElementById('share-verse')?.addEventListener('click', () => {
  const text = document.getElementById('verse-text').textContent;
  const ref = document.getElementById('verse-reference').textContent;
  const shareText = `${text}\n\n${ref}\n\nSeed the Word Ministry`;
  
  if (navigator.share) {
    navigator.share({ text: shareText }).catch(() => {});
  } else {
    navigator.clipboard.writeText(shareText).then(() => {
      alert('Verse copied to clipboard!');
    });
  }
});

// New verse button
document.getElementById('new-verse')?.addEventListener('click', () => {
  loadVerse(true);
});

// Load verse on page load
loadVerse();
</script>

</body>
</html>
