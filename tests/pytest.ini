[pytest]
# Match the *.test.py naming used by the prayer-digest property
# tests (consistent with this repo's existing JS *.test.js files).
# importlib is required because the dotted filename (foo.test.py)
# breaks pytest's default 'prepend' import mode.
python_files = *.test.py *_test.py test_*.py
addopts = --import-mode=importlib
